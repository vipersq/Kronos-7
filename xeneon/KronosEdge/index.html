<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tr('KRONOS-7')</title>
  <link rel="icon" href="resources/icon.svg" type="image/svg+xml" />
  <meta name="x-icue-widget-preview" content="resources/preview.png" />
  <meta name="x-icue-property" content="serverPort" data-label="tr('KRONOS-7 port')" data-type="textfield" data-default="'7707'" />
  <meta name="x-icue-property" content="refreshSec" data-label="tr('Refresh every')" data-type="slider" data-default="10" data-min="5" data-max="60" data-step="5" data-unit-label="'s'" />
  <meta name="x-icue-property" content="showContacts" data-label="tr('Live contacts')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="showNews" data-label="tr('News')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="showSources" data-label="tr('Source status')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="showRoutine" data-label="tr('Aircraft and ship events')" data-type="switch" data-default="true" />
  <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color" data-default="'#9dffb8'" />
  <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color" data-default="'#ffb347'" />
  <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color" data-default="'#050805'" />
  <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider" data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />
  <meta name="x-icue-property" content="scanlines" data-label="tr('Scanlines')" data-type="switch" data-default="true" />
  <script id="x-icue-groups" type="application/json">
  [
    { "title": "tr('KRONOS-7')", "properties": ["serverPort", "refreshSec", "showContacts", "showNews", "showSources", "showRoutine"] },
    { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "transparency", "scanlines"] }
  ]
  </script>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="widget-root" id="root">
    <div class="bg" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>

    <div class="top">
      <span class="brand">KRONOS-7<span class="cur">_</span></span>
      <span class="chips" id="chips"></span>
      <span class="spacer"></span>
      <button type="button" class="abtn" id="anBtn"></button>
      <span class="conn" id="conn"><span class="dot"></span><span id="connTxt"></span></span>
    </div>

    <div class="state" id="stLoading"><span class="big" id="ldTxt"></span><span class="sub" id="ldSub"></span></div>

    <div class="main" id="main" hidden="hidden">
      <section class="col col-ev">
        <button type="button" class="hero" id="hero">
          <span class="h-kind" id="hKind"></span>
          <span class="h-title" id="hTitle"></span>
          <span class="h-sub" id="hSub"></span>
        </button>
        <div class="lbl" id="evLbl"></div>
        <ul class="list" id="evList"></ul>
      </section>
      <section class="col col-ct" id="colCt">
        <div class="lbl" id="ctLbl"></div>
        <div class="grid" id="ctGrid"></div>
        <div class="srcs" id="srcs"></div>
      </section>
      <section class="col col-nw" id="colNw">
        <div class="lbl" id="nwLbl"></div>
        <ul class="list" id="nwList"></ul>
      </section>
    </div>

    <div class="ticker" id="ticker"><div class="tk" id="tk"></div></div>
  </div>
  <script src="scripts/main.js"></script>
</body>
</html>
